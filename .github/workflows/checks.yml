name: Portfolio checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:cms:flow
      - run: npm run test:channel:flow
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
